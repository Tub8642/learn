<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Моё Портфолио{% endblock %}</title>
    <!-- Вот она, волшебная ссылка на Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Портфолио</a>
        </div>
    </nav>

    <main class="container mt-4">
        {% block content %}
        <!-- Сюда будет вставляться содержимое других страниц -->
        {% endblock %}
    </main>

    <!-- Bootstrap JS (пока можно не трогать) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
