{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>{% block title %}Портфолио видеографа{% endblock %}</title>
    
    <!-- Подключаем Bootstrap и стиль Grayscale напрямую из интернета (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/gh/StartBootstrap/startbootstrap-grayscale@master/dist/css/styles.css" rel="stylesheet" />
    
    {% block extra_css %}{% endblock %}
</head>
<body id="page-top">
    <!-- Меню (пока сделаем простую навигацию) -->
    <nav class="navbar navbar-expand-lg navbar-light fixed-top" id="mainNav">
        <div class="container px-4 px-lg-5">
            <a class="navbar-brand" href="{% url 'home' %}">Портфолио</a>
            <button class="navbar-toggler navbar-toggler-right" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'contact' %}">Контакты</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Основной контент страниц -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Подвал -->
    <footer class="footer bg-black small text-center text-white-50">
        <div class="container px-4 px-lg-5">Copyright &copy; Твой сайт 2024</div>
    </footer>

    <!-- JS скрипты (тоже через CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/StartBootstrap/startbootstrap-grayscale@master/dist/js/scripts.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
