{% extends 'video/base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="text-center mb-4">Свяжитесь со мной</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.non_field_errors }}

                <!-- Имя -->
                <div class="mb-3">
                    <label for="id_name" class="form-label">Имя</label>
                    <input type="text" name="name" class="form-control" id="id_name" 
                           value="{{ form.name.value|default:'' }}">
                    {{ form.name.errors }}
                </div>

                <!-- Способ связи -->
                <div class="mb-3">
                    <label for="id_contact_type" class="form-label">Способ связи</label>
                    <select name="contact_type" id="id_contact_type" class="form-select">
                        <option value="email">Email</option>
                        <option value="phone">Телефон</option>
                        <option value="vk">Вконтакте</option>
                    </select>
                    {{ form.contact_type.errors }}
                </div>

                <!-- Контактные данные -->
                <div class="mb-3">
                    <label for="id_contact_value" class="form-label">Контактные данные</label>
                    <input type="text" name="contact_value" class="form-control" id="id_contact_value"
                           placeholder="Введите email, телефон или ссылку ВК"
                           value="{{ form.contact_value.value|default:'' }}">
                    {{ form.contact_value.errors }}
                </div>

                <!-- Сообщение -->
                <div class="mb-3">
                    <label for="id_message" class="form-label">Сообщение</label>
                    <textarea name="message" class="form-control" id="id_message" rows="4">{{ form.message.value|default:'' }}</textarea>
                    {{ form.message.errors }}
                </div>

                <button type="submit" class="btn btn-primary w-100">Отправить</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
