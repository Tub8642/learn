{% extends 'video/base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="text-center mb-4">Свяжитесь со мной</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.non_field_errors }}
                <div class="mb-3">
                    <label for="id_name" class="form-label">Имя</label>
                    <input type="text" name="name" class="form-control" id="id_name" value="{{ form.name.value|default:'' }}">
                    {{ form.name.errors }}
                </div>
                <div class="mb-3">
                    <label for="id_email" class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" id="id_email" value="{{ form.email.value|default:'' }}">
                    {{ form.email.errors }}
                </div>
                <div class="mb-3">
                    <label for="id_message" class="form-label">Сообщение</label>
                    <textarea name="message" class="form-control" id="id_message" rows="4">{{ form.message.value|default:'' }}</textarea>
                    {{ form.message.errors }}
                </div>
                <button type="submit" class="btn btn-primary w-100">Отправить</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
